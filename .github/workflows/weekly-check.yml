# Every Monday: re-check every source link and every phone number / email on its official page, and list entries
# going stale (tools/freshness.mjs). If something broke, open (or update) one GitHub issue so it gets fixed before
# someone dials a dead number; stale entries get their own "freshness" issue.
name: Weekly check (links and contacts)
on:
  schedule:
    - cron: '17 12 * * 1'   # Mondays 12:17 UTC = 09:17 in Argentina
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check links
        id: links
        continue-on-error: true
        shell: bash   # -eo pipefail: keep the checker's exit code through tee
        run: node tools/check-links.mjs | tee links.txt
      - name: Check contacts on their official pages
        id: contacts
        continue-on-error: true
        shell: bash   # -eo pipefail: keep the checker's exit code through tee
        run: node tools/check-contacts.mjs | tee contacts.txt
      - name: Open or update an issue if something failed
        if: steps.links.outcome == 'failure' || steps.contacts.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (f) => fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : '(no output)';
            const bad = (txt, re) => txt.split('\n').filter((l) => re.test(l)).join('\n') || '(none)';
            const links = read('links.txt'), contacts = read('contacts.txt');
            const title = 'Weekly check: a link or a contact needs attention';
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '', '### Contacts not found on their official page', '```', bad(contacts, /^MISS/), '```',
              'If a number is gone from the official page, remove it from `data/ar/contacts.json` until it is confirmed again (owner rule: flag, don\'t publish).',
              '', '### Broken links', '```', bad(links, /^BROKEN/), '```',
              'Some government sites block cloud servers; open the link in a browser before changing anything.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'weekly-check' });
            if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['weekly-check'] });
      - name: Freshness (entries going stale)
        run: node tools/freshness.mjs > freshness.md && node tools/freshness.mjs --json > freshness.json
      - name: Open or update the freshness issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('freshness.json', 'utf8'));
            if (!r.changes.length && !r.soon.length) return;
            const body = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` + fs.readFileSync('freshness.md', 'utf8');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'freshness' });
            if (open.length) await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, body });
            else await github.rest.issues.create({ ...context.repo, title: `Freshness: ${r.changes.length} status change(s) due, ${r.soon.length} fading soon`, body, labels: ['freshness'] });
      - name: Real scams with no known pattern
        run: node tools/unmatched.mjs > unmatched.md && node tools/unmatched.mjs --json > unmatched.json
      - name: Notify about scams with no known pattern
        uses: actions/github-script@v7
        with:
          script: |
            // docs/vision.md: a documented scam that follows no known pattern goes to a human. One open issue labelled
            // unknown-pattern; a comment only when a message appears that the issue has not listed yet.
            const fs = require('fs');
            const ids = JSON.parse(fs.readFileSync('unmatched.json', 'utf8')).groups.flatMap((g) => g.ids);
            if (!ids.length) return;
            const report = `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` + fs.readFileSync('unmatched.md', 'utf8');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'unknown-pattern' });
            if (!open.length) {
              await github.rest.issues.create({ ...context.repo, title: `${ids.length} real scam(s) with no known pattern`, body: report, labels: ['unknown-pattern'] });
              return;
            }
            const issue = open[0];
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: issue.number });
            const seen = [issue.body ?? '', ...comments.map((c) => c.body ?? '')].join('\n');
            const fresh = ids.filter((id) => !seen.includes('`' + id + '`'));
            if (fresh.length) await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `New: ${fresh.map((id) => '`' + id + '`').join(', ')}\n\n` + report });
      - name: Summary
        if: always()
        run: |
          { echo '### Links'; tail -1 links.txt || true; echo; echo '### Contacts'; tail -1 contacts.txt || true; echo; echo '### Freshness'; sed -n 3p freshness.md || true; echo; echo '### No known pattern'; sed -n 3p unmatched.md || true; } >> "$GITHUB_STEP_SUMMARY"
