# Every Tuesday: delete report copies from the encrypted private test set once they pass an `expires` date (only
# older copies carry one; tools/private-eval.mjs prune). Commits only when something expired.
name: Prune private test set
on:
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prune expired report copies
        env:
          EVAL_PRIVATE_KEY: ${{ secrets.EVAL_PRIVATE_KEY }}
        run: |
          if [ -z "$EVAL_PRIVATE_KEY" ] || [ ! -f eval/private.enc ]; then echo "No key or no private set; nothing to do"; exit 0; fi
          node tools/private-eval.mjs prune
      - name: Commit if anything expired
        run: |
          if git diff --quiet eval/private.enc; then echo "Nothing expired"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/private.enc
          git commit -m "Private test set: delete report copies past their 180-day expiry"
          git push
