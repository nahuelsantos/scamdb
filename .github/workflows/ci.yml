# Checks every change before it can reach scamdb.dev: data validation, unit tests, build, browser tests.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changes.json reads git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data
        if: hashFiles('tools/validate.mjs') != ''
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Build
        if: hashFiles('tools/build.mjs') != ''
        run: npm run build
      - name: Install Chromium for Playwright
        if: hashFiles('playwright.config.mjs') != ''
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: hashFiles('playwright.config.mjs') != ''
        run: npm run e2e
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
